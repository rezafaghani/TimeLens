apiVersion: v1
kind: Namespace
metadata:
  name: timelens
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timelens-object-storage
  namespace: timelens
data:
  ObjectStorage__ServiceUrl: http://seaweedfs:8333
  ObjectStorage__BucketName: timelens-ingestion
  ObjectStorage__Region: us-east-1
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
  namespace: timelens
spec:
  clusterIP: None
  selector:
    app: seaweedfs
  ports:
    - name: master
      port: 9333
      targetPort: master
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: timelens
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
    - name: filer
      port: 8888
      targetPort: filer
    - name: master
      port: 9333
      targetPort: master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: timelens
spec:
  serviceName: seaweedfs-headless
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          args:
            - mini
            - -dir=/data
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-credentials
                  key: secret-key
            - name: S3_BUCKET
              value: timelens-ingestion
          ports:
            - name: s3
              containerPort: 8333
            - name: filer
              containerPort: 8888
            - name: master
              containerPort: 9333
          readinessProbe:
            httpGet:
              path: /cluster/status
              port: master
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /cluster/status
              port: master
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
